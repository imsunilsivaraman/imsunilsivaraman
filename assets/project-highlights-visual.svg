<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="title desc">
<title id="title">Selected recruitment project highlights</title>
<desc id="desc">Four bright illustrated cards cover Saudi metro hiring, a confidential UAE government AI initiative, GCC national talent pipelines, and cross-border executive search. The design uses Gulf-inspired arches and geometric motifs.</desc>
<defs>
