  <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#ffe17b"/><stop offset="1" stop-color="#ffad62"/></linearGradient>
  <pattern id="lattice" width="42" height="42" patternUnits="userSpaceOnUse"><path d="M21 1 41 21 21 41 1 21Z M21 1V41M1 21h40" fill="none" stroke="#fff" stroke-width="1.3" opacity=".25"/></pattern>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#123456" flood-opacity=".19"/></filter>
</defs>
<rect width="1200" height="330" rx="28" fill="url(#sky)"/>
