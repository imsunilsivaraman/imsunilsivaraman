<g font-family="Arial,sans-serif" text-anchor="middle">
<circle cx="170" cy="197" r="17" fill="#ff5b8a"/><text x="170" y="203" fill="#fff" font-size="16" font-weight="700">1</text><text x="170" y="233" fill="#fff" font-size="14">Map the market</text>
<circle cx="460" cy="197" r="17" fill="#ffc857"/><text x="460" y="203" fill="#241744" font-size="16" font-weight="700">2</text><text x="460" y="233" fill="#fff" font-size="14">Find exceptional talent</text>
<circle cx="750" cy="197" r="17" fill="#39d8cf"/><text x="750" y="203" fill="#103c50" font-size="16" font-weight="700">3</text><text x="750" y="233" fill="#fff" font-size="14">Build strong partnerships</text>
<circle cx="1040" cy="197" r="17" fill="#a78bfa"/><text x="1040" y="203" fill="#fff" font-size="16" font-weight="700">4</text><text x="1040" y="233" fill="#fff" font-size="14">Deliver lasting impact</text>
