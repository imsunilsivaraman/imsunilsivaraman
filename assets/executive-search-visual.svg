<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="250" viewBox="0 0 1200 250" role="img" aria-labelledby="t d">
<title id="t">Executive search and talent acquisition</title><desc id="d">A colorful illustration of connecting organisations with leadership and specialist talent.</desc>
