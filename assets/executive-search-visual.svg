<text x="58" y="65" fill="#6df2df" font-family="Arial,sans-serif" font-size="16" font-weight="700" letter-spacing="3">HOW I CREATE IMPACT</text>
<text x="58" y="111" fill="#fff" font-family="Arial,sans-serif" font-size="31" font-weight="700">The right people. The right opportunity.</text>
<text x="58" y="145" fill="#d8e8ff" font-family="Arial,sans-serif" font-size="17">From market insight to successful placement across the GCC and international markets.</text>
